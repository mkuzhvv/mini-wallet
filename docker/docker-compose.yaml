services:

  postgres:
    image: postgres:16
    container_name: miniwallet-postgres

    environment:
      POSTGRES_DB: miniwallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wallet -d miniwallet" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: