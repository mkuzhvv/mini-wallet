spring:
  application:
    name: payment-service

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/miniwallet?currentSchema=payment
    username: wallet
    password: wallet

  flyway:
    schemas:
      - payment
    locations:
      - classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8082