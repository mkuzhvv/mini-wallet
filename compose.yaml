name: mini-wallet

services:
  postgres:
    image: postgres:16
    container_name: miniwallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: miniwallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d miniwallet"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    container_name: miniwallet-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 10

  kafka-init:
    image: apache/kafka:4.3.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ledger-transactions
      - --partitions
      - "3"
      - --replication-factor
      - "1"

  user-service:
    build:
      context: .
      dockerfile: dockerfiles/user-service.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/miniwallet?currentSchema=user_service
    depends_on:
      postgres:
        condition: service_healthy

  ledger-service:
    build:
      context: .
      dockerfile: dockerfiles/ledger-service.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/miniwallet?currentSchema=ledger
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  payment-service:
    build:
      context: .
      dockerfile: dockerfiles/payment-service.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/miniwallet?currentSchema=payment
      LEDGER_BASEURL: http://ledger-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      ledger-service:
        condition: service_healthy

  statement-service:
    build:
      context: .
      dockerfile: dockerfiles/statement-service.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/miniwallet?currentSchema=statement
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  gateway-service:
    build:
      context: .
      dockerfile: dockerfiles/gateway-service.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      USER_SERVICE_URL: http://user-service:8084
      LEDGER_SERVICE_URL: http://ledger-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
      STATEMENT_SERVICE_URL: http://statement-service:8083
    depends_on:
      user-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      statement-service:
        condition: service_healthy

  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./dockerfiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway-service:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  pgdata:
  kafkadata:
